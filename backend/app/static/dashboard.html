<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Auto Initiativ</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/dashboard.css?v=guided-recruiter-3">
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <a class="brand" href="#home" aria-label="Auto Initiativ home">
          <span class="brand-mark" aria-hidden="true">AI</span>
          <span>
            <strong>Auto Initiativ</strong>
            <small>Personal recruiter</small>
          </span>
        </a>

        <nav class="primary-nav" id="primaryNav" aria-label="Primary navigation"></nav>

        <div class="header-actions">
          <span class="environment-chip" id="environmentChip">Checking safety mode</span>
          <button class="icon-button" id="refreshButton" type="button" aria-label="Refresh">
            <span aria-hidden="true">Refresh</span>
          </button>
          <button class="account-button" id="accountButton" type="button" aria-expanded="false" aria-controls="accountMenu">
            Alex
          </button>
          <div class="account-menu" id="accountMenu" hidden>
            <button type="button" data-route="advanced">Advanced/Admin</button>
            <button type="button" data-route="settings" disabled title="Settings are not editable yet.">Settings</button>
          </div>
        </div>
      </header>

      <main class="main-shell">
        <section class="journey" aria-label="Recruiter journey" id="journey"></section>
        <section class="page" id="page" tabindex="-1"></section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header">
          <h2 id="modalTitle">Confirm</h2>
          <button class="icon-only" type="button" id="modalClose" aria-label="Close">x</button>
        </div>
        <div id="modalBody"></div>
      </section>
    </div>

    <script src="/static/dashboard.js?v=guided-recruiter-3"></script>
  </body>
</html>
