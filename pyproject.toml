[project]
name = "auto-initiativ"
version = "0.1.0"
description = "Local-first, safety-first agentic job outreach backend."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlmodel>=0.0.21,<1.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "jsonschema>=4.22,<5.0",
  "pypdf>=4.0,<6.0",
  "pydantic[email]>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1.0",
  "pytest>=8.2,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
